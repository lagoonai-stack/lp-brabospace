server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # redirects relativos: o 301 de "/condicao-especial" -> "/condicao-especial/"
    # sai sem host interno, então o browser mantém brabospace.com
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
